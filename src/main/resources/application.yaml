spring:
  application:
    name: spring-boot-marktplace

  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/db_marktplace
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect